name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install Ruff
        run: python -m pip install --upgrade pip "ruff>=0.6,<1"

      - name: Check lint and formatting
        run: |
          python -m ruff check src tests
          python -m ruff format --check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"

      - name: Install package and test tools
        run: python -m pip install -e . "pytest>=8,<10" "pytest-cov>=5,<8"

      - name: Unit tests
        run: python -m pytest --cov=bioai --cov-report=term-missing

      - name: CLI smoke test
        run: |
          python -m bioai about
          python -m bioai features --sequence ATGATGATGATG --output /tmp/features.npy
