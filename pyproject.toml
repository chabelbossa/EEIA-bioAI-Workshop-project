[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeia-bioai"
version = "0.1.0"
description = "Reproducible coding-vs-non-coding DNA classification utilities from EEIA 2026"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "EEIA 2026 bioAI project participants" },
]
keywords = [
  "bioinformatics",
  "genomics",
  "knowledge-distillation",
  "machine-learning",
  "evo2",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scikit-learn>=1.4,<2",
  "torch>=2.2,<3",
]

[project.optional-dependencies]
notebooks = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4.2,<5",
  "matplotlib>=3.8,<4",
  "requests>=2.31,<3",
  "tqdm>=4.66,<5",
  "umap-learn>=0.5.6,<1",
]
dev = [
  "pre-commit>=3.7,<5",
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
]
serve = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
bioai = "bioai.cli:main"

[project.urls]
Repository = "https://github.com/chabelbossa/EEIA-bioAI-Workshop-project"
Documentation = "https://github.com/chabelbossa/EEIA-bioAI-Workshop-project/tree/main/docs"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["bioai"]
omit = ["src/bioai/api.py", "src/bioai/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
